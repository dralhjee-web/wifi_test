<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة العداد والإعلانات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية الإعلان */
        .ad-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #131b2e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1f2d4a;
        }

        /* صندوق العداد التفاعلي */
        .clicker-box {
            background-color: #131b2e;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 2px solid #2563eb;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, background-color 0.2s ease;
            margin: 15px 0;
        }

        .clicker-box:active {
            transform: scale(0.95);
            background-color: #1a2642;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #f8fafc;
        }

        .counter-display {
            font-size: 60px;
            font-weight: bold;
            color: #22c55e;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- إعلان Adsterra (مقاس 300x250) -->
    <div class="ad-container">
        <script>
            atOptions = {
                'key' : 'e4b3426014b6de4b69856962027e3a76',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/e4b3426014b6de4b69856962027e3a76/invoke.js"></script>
    </div>

    <!-- صندوق العداد -->
    <div class="clicker-box" onclick="incrementCounter()">
        <h1>اضغط هنا لزيادة العداد</h1>
        <div class="counter-display" id="counter">0</div>
        <div class="hint">كل ضغطة تحتسب وتصدر صوتاً!</div>
    </div>

    <script>
        let count = 0;

        // الترحيب الصوتي تلقائياً عند فتح الموقع
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                speakWelcome();
            }, 500);
        });

        function speakWelcome() {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance("نورت الموقع يا سيدها");
                utterance.lang = 'ar-SA'; // اللهجة العربية
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // دالة زيادة العداد مع إصدار صوت تفاعلي (Bip)
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = count;
            playClickSound();
        }

        // مولد صوت تفاعلي يشبه النقرة أو طيط اللعبة برمجياً بدون الحاجة لملفات خارجية
        function playClickSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // تردد صوتي مرح (نغمة D5)
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                // تجاوز الخطأ في حال لم يدعم المتصفح الصوت التلقائي قبل التفاعل
            }
        }
    </script>

</body>
</html>
