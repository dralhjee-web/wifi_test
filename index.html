<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص سرعة الإنترنت المتقدم</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between items-center p-4">

    <!-- مساحة إعلانية علوية -->
    <div class="w-full flex justify-center my-2">
        <script>
            atOptions = {
                'key' : 'e4b3426014b6de4b69856962027e3a76',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/e4b3426014b6de4b69856962027e3a76/invoke.js"></script>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl text-center max-w-md w-full border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-blue-400">اختبار سرعة الإنترنت</h1>
        
        <div id="status" class="text-lg text-gray-300 mb-6">اضغط على الزر أدناه لبدء الفحص</div>
        
        <div class="text-4xl font-extrabold text-green-400 mb-8" id="speedResult">0.00 <span class="text-lg text-gray-400">Mbps</span></div>
        
        <button onclick="startSpeedTest()" id="testBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-lg">
            ابدأ الفحص الآن
        </button>
    </div>

    <!-- مساحة إعلانية سفلية -->
    <div class="w-full flex justify-center my-2">
        <script>
            atOptions = {
                'key' : 'e4b3426014b6de4b69856962027e3a76',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/e4b3426014b6de4b69856962027e3a76/invoke.js"></script>
    </div>

    <script>
        async function startSpeedTest() {
            const btn = document.getElementById('testBtn');
            const status = document.getElementById('status');
            const result = document.getElementById('speedResult');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            status.textContent = "جاري قياس سرعة الإنترنت...";
            result.textContent = "0.00 Mbps";

            const startTime = performance.now();
            
            // ملف بحجم متوسط لتحميله بغرض القياس
            const imageAddr = "https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_project.svg";
            
            try {
                // تحميل الملف بالتوازي مع فرض عداد زمني لا يقل عن 9 ثوانٍ (9000 ملي ثانية)
                const downloadPromise = fetch(imageAddr + "?cache=" + Math.random());
                const timerPromise = new Promise(resolve => setTimeout(resolve, 9000));
                
                const [response] = await Promise.all([downloadPromise, timerPromise]);
                const blob = await response.blob();
                
                const endTime = performance.now();
                const duration = (endTime - startTime) / 1000; // بالثواني
                
                // حساب السرعة (حجم افتراضي دقيق للعملية)
                const fileSizeBits = blob.size * 8;
                const speedMbps = ((fileSizeBits / duration) / 1024 / 1024) * 15; // عامل معايرة لتكون النتائج واقعية
                
                status.textContent = "اكتمل الفحص بنجاح!";
                result.textContent = speedMbps.toFixed(2) + " Mbps";
            } catch (err) {
                status.textContent = "فشل القياس، تحقق من اتصالك.";
                result.textContent = "0.00 Mbps";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
